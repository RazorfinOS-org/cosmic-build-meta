# Live session user. Autologin via greetd. Privileged install actions
# are handled by cosmonaut-installer's root DBus daemon and live-only
# polkit allow rule; the wheel membership remains a compatibility
# convenience for manual live-debugging and older installer flows.
#
# Only ever exists in the Live ISO image (oci/cosmic-live, oci/cosmic-nvidia-live).
# Installed systems do not ship this user; their first user is created
# by the installer during or after install.
# Pin a system-range UID. files/oci/greetd/cosmic-initial-setup-wrapper
# guards the OOBE on `getent passwd` finding a UID in [1000, 65000).
# Letting sysusers auto-pick risks landing cosmic-live in that range
# and tripping the guard on installed systems if cosmic-live somehow
# leaked into the deployed root (it shouldn't, but defense in depth).
# 955 sits between cosmic-greeter (950) and cosmic-initial-setup (980).
#
# Group memberships:
#   wheel  -- compatibility/debug convenience for the live environment;
#             normal cosmonaut-installer elevation uses polkit + DBus.
#   video  -- /dev/dri/card* read/modeset access for the live user.
#   input  -- /dev/input/event* read for libinput.
#   render -- /dev/dri/renderD128 access (Mesa GBM, NVIDIA EGL/GBM).
#             Required for any GL/EGL client. udev assigns the device
#             to this group; cosmic-comp + every libcosmic app needs it.
#
# `g render -` line below: render is not created by FDSDK's basic
# sysusers, only by udev rules at runtime -- but those don't fire in
# the BST sandbox at image-build time, so cosmic-live's `m render`
# would fail without an explicit group create.
#
# Home is /home/cosmic-live (NOT /var/lib/cosmic-live) so COSMIC's
# normal per-user paths, autostart handling, and installer/debug tools
# behave like they do for a desktop user. The older tuna-installer
# Flatpak also required a /home/* path for host/sandbox cache sharing;
# keeping the same home location preserves compatibility with those
# historical live-debug flows.
g  render       -
u  cosmic-live  955  "COSMIC Live"  /home/cosmic-live  /usr/bin/bash
m  cosmic-live  wheel
m  cosmic-live  video
m  cosmic-live  input
m  cosmic-live  render
