# Symlink /etc/resolv.conf to systemd-resolved's stub resolver. L+ replaces
# any existing file so applications that read resolv.conf directly instead of
# using NSS (Steam, distrobox containers, musl binaries) get working DNS.
L+ /etc/resolv.conf - - - - /run/systemd/resolve/stub-resolv.conf
# Seed /etc/hosts from the factory copy only when none exists -- C skips
# existing files, so a machine-local hosts file is never clobbered.
C /etc/hosts - - - - /usr/share/factory/etc/hosts
