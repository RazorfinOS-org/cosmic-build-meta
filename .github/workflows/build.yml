name: Build & Publish OCI image

on:
  schedule:
    # Weekly Monday 08:00 UTC. Cold builds are multi-hour (BST + Rust);
    # daily isn't realistic until the artifact cache is consistently warm.
    - cron: '0 8 * * 1'
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  # No paths-ignore on pull_request: the changes job skips docs-only PRs
  # at job level so the build-ok required check still reports.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read        # checkout
  packages: write       # GHCR push for image + BST artifact cache
  id-token: write       # OIDC for keyless cosign signing
  attestations: write   # Sigstore build-provenance attestations

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io/razorfinos-org/cosmic-build-meta

jobs:
  changes:
    name: Detect build-relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Filter changed files
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          if printf '%s\n' "$FILES" | grep -vE '\.md$|^docs/|^LICENSE' | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build_and_push:
    name: Build & Push ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs: changes

    strategy:
      fail-fast: false
      matrix:
        # Four image variants ship from this repo: the open-source GPU
        # variant (cosmic), the NVIDIA proprietary one (cosmic-nvidia),
        # and the gaming flavour of each. The gaming axis is a BST
        # project option (`-o gaming true` via COSMIC_GAMING) on the
        # same element paths: it adds gaming/deps.bst to the stack and
        # swaps the kernel for the OGC build (core-deps/linux-ogc.bst).
        # `image` is the effective identity used for tags, cache keys,
        # and log artifacts.
        include:
          - variant: cosmic
            gaming: "false"
            image: cosmic
          - variant: cosmic-nvidia
            gaming: "false"
            image: cosmic-nvidia
          - variant: cosmic
            gaming: "true"
            image: cosmic-gaming
          - variant: cosmic-nvidia
            gaming: "true"
            image: cosmic-nvidia-gaming

    # Skip image rebuild on most PRs to save runner minutes; only run on:
    #   - non-PR events (push/cron/workflow_dispatch)
    #   - auto-track PRs (verifies upstream-source bumps build cleanly)
    #   - PRs explicitly labelled `build` (manual opt-in)
    if: >-
      needs.changes.outputs.build == 'true' &&
      (github.event_name != 'pull_request' ||
       startsWith(github.head_ref, 'auto/track-') ||
       contains(github.event.pull_request.labels.*.name, 'build'))

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on runner
        # ubuntu-24.04 ships ~14 GB free; BST cache + podman storage
        # easily blow past that on cold builds. Frees ~30 GB by removing
        # Android SDK, .NET, GHC, Haskell tools, etc.
        uses: ublue-os/remove-unwanted-software@v9

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Determine push eligibility
        id: eligibility
        # PRs from forks have a read-only GITHUB_TOKEN -- push to GHCR
        # would fail. Build still runs (validates the change), push and
        # cache-write are skipped.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "can_push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR from fork; image push and cache-write disabled (read-only token)"
          else
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine image tags
        id: tags
        # Tags are image-prefixed (cosmic-nightly, cosmic-nvidia-nightly,
        # cosmic-gaming-nightly, cosmic-nvidia-gaming-nightly) so all
        # variants coexist in the same registry repo. PR builds get
        # a single :{image}-pr-N tag; tag-push events get :{image}-{ref}
        # plus :{image}-stable; everything else gets :{image}-nightly +
        # :{image}-nightly.YYYYMMDD.
        run: |
          DATE=$(date -u +%Y%m%d)
          V="${{ matrix.image }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "primary_tag=${V}-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "additional_tags=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            REF="${GITHUB_REF#refs/tags/}"
            echo "primary_tag=${V}-${REF}" >> "$GITHUB_OUTPUT"
            echo "additional_tags=${V}-stable" >> "$GITHUB_OUTPUT"
          else
            echo "primary_tag=${V}-nightly" >> "$GITHUB_OUTPUT"
            echo "additional_tags=${V}-nightly.${DATE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate BuildStream CI config
        # Fork PRs / missing credentials degrade to a local-only config;
        # anonymous pulls still work via project.conf.
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        uses: ./.github/actions/generate-bst-ci-config
        with:
          enable-remote-execution: ${{ steps.eligibility.outputs.can_push == 'true' && vars.CASD_CLIENT_CERT != '' }}
          enable-push: ${{ steps.eligibility.outputs.can_push }}

      - name: Restore BuildStream local cache
        # Transitional fallback while the remote cache warms; drop once
        # hit rates hold. Per-image key so the matrix jobs don't fight
        # over the same cache; the gaming jobs fall back to their
        # non-gaming sibling's cache, then to any arch cache. Cap is
        # 10 GB per repo on github-hosted.
        uses: actions/cache@v4
        with:
          path: ~/.cache/buildstream
          key: bst-cache-${{ runner.arch }}-${{ matrix.image }}-${{ github.run_id }}
          restore-keys: |
            bst-cache-${{ runner.arch }}-${{ matrix.image }}-
            bst-cache-${{ runner.arch }}-${{ matrix.variant }}-
            bst-cache-${{ runner.arch }}-

      - name: Build OCI image (${{ matrix.image }})
        # `just build-variant <v>` = `bst build oci/<v>/image.bst` then
        # `just load-image-variant <v>` (podman build --squash-all to
        # flatten layers for bootc 1.15 compatibility). COSMIC_IMAGE_TAG
        # gets the full image-prefixed tag so the local podman tag
        # matches what we push to GHCR. COSMIC_GAMING routes into
        # `bst -o gaming <bool>` via the Justfile.
        env:
          COSMIC_IMAGE_TAG: ${{ steps.tags.outputs.primary_tag }}
          COSMIC_GAMING: ${{ matrix.gaming }}
          BST_FLAGS: '--no-interactive --on-error=continue --config /src/buildstream-ci.conf'
          RE_EXPECTED: ${{ steps.eligibility.outputs.can_push == 'true' && vars.CASD_CLIENT_CERT != '' }}
        run: |
          set -o pipefail
          just build-variant ${{ matrix.variant }} 2>&1 | tee /tmp/bst-console.log
          # A green cache hit is not proof BuildStream loaded the remote
          # executor; fail closed if the startup banner is missing.
          if [ "$RE_EXPECTED" = "true" ]; then
            grep -q "Remote Execution Configuration" /tmp/bst-console.log \
              || { echo "::error::remote execution requested but not engaged"; exit 1; }
          fi

      - name: Remove CASD client credentials
        if: always()
        run: rm -f client.key client.crt

      - name: Rechunk image into content-based layers
        # Replaces the single squashed layer so `bootc upgrade` pulls
        # deltas; set repo variable COSMIC_SKIP_CHUNK=1 to bypass.
        if: steps.eligibility.outputs.can_push == 'true' && vars.COSMIC_SKIP_CHUNK != '1'
        env:
          COSMIC_IMAGE_TAG: ${{ steps.tags.outputs.primary_tag }}
          COSMIC_GAMING: ${{ matrix.gaming }}
        run: |
          sudo apt-get install -y -q --no-install-recommends attr
          just chunk-variant ${{ matrix.variant }}

      - name: Log in to GHCR
        if: steps.eligibility.outputs.can_push == 'true'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        id: push
        if: steps.eligibility.outputs.can_push == 'true'
        env:
          PRIMARY_TAG: ${{ steps.tags.outputs.primary_tag }}
          ADDITIONAL_TAGS: ${{ steps.tags.outputs.additional_tags }}
        run: |
          set -euo pipefail
          # zstd layers: smaller pulls, and required groundwork for
          # chunked-layer publishing later. --digestfile captures the
          # pushed manifest digest (dakota's formula); podman inspect
          # .Digest on a locally built image is unreliable.
          sudo podman push --compression-format=zstd \
            --digestfile /tmp/push-digest.txt "${IMAGE_REGISTRY}:${PRIMARY_TAG}"
          for tag in ${ADDITIONAL_TAGS}; do
            sudo podman tag "${IMAGE_REGISTRY}:${PRIMARY_TAG}" "${IMAGE_REGISTRY}:${tag}"
            sudo podman push --compression-format=zstd "${IMAGE_REGISTRY}:${tag}"
          done
          DIGEST=$(cat /tmp/push-digest.txt)
          echo "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$' \
            || { echo "::error::invalid pushed digest: $DIGEST"; exit 1; }
          {
            echo "pushed=true"
            echo "digest=${DIGEST}"
            echo "image_ref=${IMAGE_REGISTRY}@${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.push.outputs.pushed == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless via Sigstore OIDC)
        if: steps.push.outputs.pushed == 'true'
        # No private key needed. Sigstore Fulcio CA issues a short-lived
        # cert tied to this workflow's GitHub OIDC identity. Verify with:
        #   cosign verify ${IMAGE_REGISTRY}:cosmic-nightly \
        #     --certificate-identity-regexp \
        #       'https://github.com/razorfinos-org/cosmic-build-meta/.github/workflows/build.yml@.+' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
        run: cosign sign --yes "${{ steps.push.outputs.image_ref }}"

      - name: Generate build provenance attestation
        if: steps.push.outputs.pushed == 'true'
        # SLSA build-provenance v1; verifiable via `cosign verify-attestation`
        # or `gh attestation verify`. Stored as a sibling artifact to the image.
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Upload BST logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.image }}
          path: ~/.cache/buildstream/logs/
          retention-days: 7

  build-ok:
    # Single stable-named aggregator for branch protection; skipped
    # matrix jobs count as pass.
    name: Build OK
    if: always()
    needs: [changes, build_and_push]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          r="${{ needs.build_and_push.result }}"
          [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
