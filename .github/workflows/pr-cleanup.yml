name: PR cleanup

# Delete PR tags from GHCR when the PR closes (merged or not).
# Build workflow pushes a plain :pr-N tag to each variant's package for
# internal-source PRs (auto/track-* or `build`-labelled). Without
# cleanup, those tags pile up forever.

on:
  pull_request:
    types: [closed]

permissions:
  packages: write

jobs:
  delete_pr_tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete PR tags from GHCR
        # Use gh CLI to delete by tag. actions/delete-package-versions
        # only supports deletion by version-id, which would require an
        # extra lookup step; the gh API call does it in one shot.
        # Tolerate 404 (tag may not exist if the build was skipped).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          # One package per variant; each gets a plain :pr-N tag.
          for PACKAGE in cosmic cosmic-gaming cosmic-nvidia cosmic-nvidia-gaming; do
            PR_TAG="pr-${PR_NUMBER}"
            # Resolve tag -> version id, then delete that version. Tolerate
            # missing tags (PR was filtered out of the build matrix).
            VERSION_ID=$(gh api \
              "/orgs/${OWNER}/packages/container/${PACKAGE}/versions" \
              --paginate \
              --jq ".[] | select(.metadata.container.tags[]? == \"${PR_TAG}\") | .id" \
              2>/dev/null | head -n1)

            if [ -z "${VERSION_ID}" ]; then
              echo "::notice::${PACKAGE}:${PR_TAG} not found; nothing to delete"
              continue
            fi

            echo "Deleting ${PACKAGE} version ${VERSION_ID} (tag ${PR_TAG})"
            gh api \
              --method DELETE \
              "/orgs/${OWNER}/packages/container/${PACKAGE}/versions/${VERSION_ID}"
          done
