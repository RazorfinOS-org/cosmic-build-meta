name: Build Live ISO

on:
  workflow_dispatch:
    inputs:
      variant:
        description: ISO variant to build
        type: choice
        required: true
        default: both
        options:
          - cosmic
          - cosmic-nvidia
          - both
      image_tag:
        description: Published image tag/suffix to bake into the ISO (nightly -> <variant>-nightly; full image refs are accepted)
        type: string
        required: true
        default: nightly
      release_tag:
        description: Optional GitHub Release tag to upload ISO assets to
        type: string
        required: false
        default: ''

permissions:
  contents: write       # optional GitHub Release upload
  packages: read        # pull published GHCR image
  id-token: write       # OIDC for keyless cosign blob signing

concurrency:
  group: iso-${{ github.ref }}-${{ inputs.variant }}-${{ inputs.image_tag }}
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io/razorfinos-org/cosmic-build-meta

jobs:
  build_iso:
    name: Build ISO ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'both' && '["cosmic","cosmic-nvidia"]' || format('["{0}"]', inputs.variant)) }}

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on runner
        uses: ublue-os/remove-unwanted-software@v9

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Restore BuildStream local cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/buildstream
          key: bst-cache-${{ runner.arch }}-iso-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            bst-cache-${{ runner.arch }}-${{ matrix.variant }}-
            bst-cache-${{ runner.arch }}-

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source image
        id: image
        run: |
          set -euo pipefail
          V="${{ matrix.variant }}"
          INPUT="${{ inputs.image_tag }}"

          if [[ "$INPUT" == */* ]]; then
            IMAGE_REF="$INPUT"
          else
            if [[ "$INPUT" == "$V-"* ]]; then
              TAG="$INPUT"
            else
              TAG="$V-$INPUT"
            fi
            IMAGE_REF="${IMAGE_REGISTRY}:${TAG}"
          fi

          SAFE_NAME=$(printf '%s' "$IMAGE_REF" | tr '/:@' '----' | tr -c 'A-Za-z0-9._-' '-')
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"
          echo "Using $IMAGE_REF"

      - name: Stage offline install source from published image
        run: just prep-install-source-from-image ${{ matrix.variant }} "${{ steps.image.outputs.image_ref }}"

      - name: Build Live ISO (${{ matrix.variant }})
        env:
          BST_FLAGS: '--no-interactive --on-error=continue'
        run: just build-iso-from-prepared-source ${{ matrix.variant }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Live ISO (keyless via Sigstore OIDC)
        run: |
          set -euo pipefail
          ISO="build/iso/${{ matrix.variant }}-stable-amd64.iso"
          cosign sign-blob --yes \
              --output-signature "${ISO}.sig" \
              --output-certificate "${ISO}.cert" \
              "${ISO}"
          sha256sum "${ISO}" > "${ISO}.sha256"

      - name: Upload ISO as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.variant }}-${{ steps.image.outputs.safe_name }}
          path: |
            build/iso/${{ matrix.variant }}-stable-amd64.iso
            build/iso/${{ matrix.variant }}-stable-amd64.iso.sha256
            build/iso/${{ matrix.variant }}-stable-amd64.iso.sig
            build/iso/${{ matrix.variant }}-stable-amd64.iso.cert
          retention-days: 90
          if-no-files-found: error

      - name: Upload ISO to GitHub Release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            build/iso/${{ matrix.variant }}-stable-amd64.iso
            build/iso/${{ matrix.variant }}-stable-amd64.iso.sha256
            build/iso/${{ matrix.variant }}-stable-amd64.iso.sig
            build/iso/${{ matrix.variant }}-stable-amd64.iso.cert
          append_body: false

      - name: Upload BST logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iso-build-logs-${{ matrix.variant }}
          path: ~/.cache/buildstream/logs/
          retention-days: 7
